<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Image URL Generator (Final Fixed)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 650px; background: white; margin: 30px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        h2 { color: #1e3a8a; margin-bottom: 5px; }
        p { color: #666; margin-top: 0; font-size: 14px; }
        .info-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 6px; text-align: left; margin-bottom: 20px; font-size: 14px; color: #1e40af; }
        .upload-section { background: #f8fafc; border: 2px dashed #cbd5e1; padding: 30px; border-radius: 8px; margin-top: 20px; }
        input[type="file"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; }
        .upload-btn { background: #2563eb; color: white; padding: 12px 20px; font-size: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        .status { margin-top: 15px; font-weight: bold; color: #2563eb; display: none; }
        .result-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: left; }
        textarea { width: 100%; height: 70px; padding: 10px; border: 1px solid #bbf7d0; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 13px; color: #0f766e; background: white; resize: none; }
        .copy-btn { background: #10b981; color: white; padding: 10px 20px; font-size: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛍️ E-com Image URL Generator</h2>
    <p>Upload product image to get cloud URL for Amazon/Flipkart</p>
    
    <div class="info-box">
        <strong>💡 E-commerce Guidelines Reminder:</strong>
        <ul>
            <li>Amazon / Flipkart: 1:1 Square, White Background.</li>
        </ul>
    </div>

    <div class="upload-section">
        <input type="file" id="imageInput" accept="image/*">
        <button id="uploadBtn" class="upload-btn" onclick="uploadImage()">Upload & Generate Working Link</button>
        <div id="statusText" class="status">Uploading to server... Please wait.</div>
    </div>

    <div class="result-box">
        <h3>📋 Live E-commerce Link:</h3>
        <textarea id="urlDisplay" readonly placeholder="Yahan real internet URL aayega..."></textarea>
        <button class="copy-btn" onclick="copyUrl()">Copy URL</button>
    </div>
</div>

<script>
    function uploadImage() {
        const fileInput = document.getElementById('imageInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusText = document.getElementById('statusText');
        const urlDisplay = document.getElementById('urlDisplay');

        if (!fileInput.files || fileInput.files.length === 0) {
            alert("Kripya image select karein!");
            return;
        }

        uploadBtn.disabled = true;
        statusText.style.display = "block";

        const file = fileInput.files[0];
        const formData = new FormData();
        // Hum free anonymous hosting service use kar rahe hain jo bina key ke direct link deti hai
        formData.append("file", file);

        fetch("https://tmpfiles.org", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(result => {
            uploadBtn.disabled = false;
            statusText.style.display = "none";

            if (result.status === "success") {
                // Tmpfiles.org ka download link ko direct image link mein convert karna
                let rawUrl = result.data.url;
                let directUrl = rawUrl.replace("https://tmpfiles.org", "https://tmpfiles.orgdl/");
                urlDisplay.value = directUrl;
                alert("Mubarak ho! Sahi URL ban gaya.");
            } else {
                alert("Upload failed.");
            }
        })
        .catch(error => {
            uploadBtn.disabled = false;
            statusText.style.display = "none";
            alert("Network dikkat aayi, dobara try karein.");
        });
    }

    function copyUrl() {
        const urlText = document.getElementById('urlDisplay').value;
        if(!urlText || urlText.startsWith("Yahan real")) return;
        navigator.clipboard.writeText(urlText).then(() => { alert("URL copy ho gaya!"); });
    }
</script>

</body>
</html>
